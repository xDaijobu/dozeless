name: Publish

# Runs when a version tag is pushed, e.g. v0.1.1. Needs automated publishing turned on at
# pub.dev/packages/dozeless/admin: repository xDaijobu/dozeless, tag pattern v{{version}},
# environment pub.dev. The first version has to be published by hand.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev authenticates the run through GitHub's OIDC token
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1 # sets up the pub.dev token
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
