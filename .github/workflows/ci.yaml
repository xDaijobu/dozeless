name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plugin
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Kotlin unit tests
        working-directory: example
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :dozeless:testDebugUnitTest --console=plain
