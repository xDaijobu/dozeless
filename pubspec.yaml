name: dozeless
description: "AlarmManager-only background job runner for Flutter on Android. Job logic is written in Dart and runs in a headless engine."
version: 0.1.0
repository: https://github.com/xDaijobu/dozeless
issue_tracker: https://github.com/xDaijobu/dozeless/issues
topics:
  - background
  - alarm
  - android
  - doze
  - background-location

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.xdaijobu.dozeless
        pluginClass: DozelessPlugin
