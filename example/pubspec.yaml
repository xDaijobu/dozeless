name: dozeless_example
description: "Feasibility app for the dozeless plugin: a location job every minute and a 20-second job."
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dozeless:
    path: ../
  geolocator: ^14.1.2
  path: ^1.9.1
  permission_handler: ^13.0.2
  sqflite: ^2.4.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
